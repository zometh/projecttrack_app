name: diop_mouhamed_l3gl_examen
description: "A collaborative project management."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.7.0-323.2.beta

dependencies:
  awesome_dialog: ^3.2.1
  chat_bubbles: ^1.7.0
  cloud_firestore: ^5.6.5
  cupertino_icons: ^1.0.8
  email_validator: ^3.0.0
  excel: ^4.0.6
  file_picker: ^9.2.0
  firebase_auth: ^5.5.1
  firebase_core: ^3.12.1
  fl_chart: ^0.70.2

  flutter:
    sdk: flutter
  flutter_dotenv: ^5.2.1
  
  flutter_local_notifications: ^19.0.0
  flutter_native_splash: ^2.4.4
  flutter_pdfview: ^1.4.0
  flutter_screenutil: ^5.9.3
  flutter_slidable: ^4.0.0
  get: ^4.7.2
  google_fonts: ^6.2.1
  http: ^1.3.0
  iconsax: ^0.0.8
  image_picker: ^1.1.2
  insta_image_viewer: ^1.0.4
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.5
  percent_indicator: ^4.2.4
  permission_handler: ^11.4.0
  share_plus: ^10.1.4
  shared_preferences: ^2.5.2
  spreadsheet_decoder: ^2.3.0
  step_progress_indicator: ^1.0.2
  supabase: ^2.6.3
  supabase_flutter: ^2.8.4
  toastification: ^3.0.1

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec
# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  # To add assets to your application, add an assets section, like this:
  assets:
    - .env
    - lib/assets/img/
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images
  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package
  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
flutter_launcher_icons:
android: "launcher_icon"
ios: true
image_path: "lib/assets/img/logo.png"
min_sdk_android: 21 # android min sdk min:16, default 21

windows:
  generate: true
  image_path: "lib/assets/img/logo.png"
  icon_size: 48 # min:48, max:256, default: 48
macos:
  generate: true
  image_path: "lib/assets/img/logo.png"

flutter_native_splash:
  android: true
  ios: true
  web: false
  color: "#FFFFFF"
  image: lib/assets/img/launcher.png
  branding: lib/assets/img/splash.png
  branding_bottom_padding: 24
  android_12:
    color: "#FFFFFF"
    image: lib/assets/img/launcher.png
    branding: lib/assets/img/splash.png
    branding_bottom_padding: 24
